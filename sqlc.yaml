version: "2"
sql:
  - schema: "migrations/000001_initial_schema.sql"
    queries: "internal/database/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "dbgen"
        out: "internal/database/dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
