services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=sendio
      - POSTGRES_PASSWORD=sendio
      - POSTGRES_DB=sendio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Mailpit web ui

volumes:
  postgres_data:
  redis_data:
